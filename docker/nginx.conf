server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The app calls relative URLs such as /api/tasks. The dev server strips /api and forwards to
  # the mock backend, and so does this proxy.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The build names its scripts, styles and fonts after their content, so they never change under
  # the same name and a browser may keep them for a year.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The entry page must always be fetched again, because it names the current files.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Any other path is a route of the single page app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
